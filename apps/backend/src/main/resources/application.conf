ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [com.etherealnature.backend.ApplicationKt.module]
  }
}

jwt {
  # Dev fallback only — set JWT_SECRET in any real environment.
  secret = "dev-only-secret-do-not-use-in-production"
  secret = ${?JWT_SECRET}
  issuer = "ethereal-nature"
  audience = "ethereal-nature-web"
  expiresInMinutes = 1440
}

admin {
  # Bootstrap ADMIN account, created at startup if missing.
  email = "admin@ethereal.dev"
  email = ${?ADMIN_EMAIL}
  password = "admin-dev-password"
  password = ${?ADMIN_PASSWORD}
}

demo {
  # Read-only back-office demo account + the one-click demo login endpoint.
  viewerEmail = "viewer@ethereal.dev"
  viewerEmail = ${?VIEWER_EMAIL}
  viewerPassword = "viewer-dev-password"
  viewerPassword = ${?VIEWER_PASSWORD}
  # Registers POST /auth/demo and seeds the viewer; enable only in demo deployments.
  loginEnabled = true
  loginEnabled = ${?DEMO_LOGIN_ENABLED}
}

payments {
  # Shared secret the mock PSP signs webhook events with. Dev fallback only.
  webhookSecret = "dev-only-webhook-secret-do-not-use-in-production"
  webhookSecret = ${?PAYMENTS_WEBHOOK_SECRET}
  # The simulate endpoint is dev tooling; disable it in any real environment.
  mockPspEnabled = true
  mockPspEnabled = ${?MOCK_PSP_ENABLED}
}

cors {
  # Comma-separated scheme://host origins; override per environment.
  allowedOrigins = "http://localhost:3000,http://localhost:3001"
  allowedOrigins = ${?CORS_ALLOWED_ORIGINS}
}

database {
  url = "jdbc:postgresql://localhost:5432/ethereal_nature"
  url = ${?DATABASE_URL}
  user = ${USER}
  user = ${?DATABASE_USER}
  password = ""
  password = ${?DATABASE_PASSWORD}
}
